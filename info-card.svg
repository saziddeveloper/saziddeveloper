<?xml version="1.0" encoding="UTF-8"?>

<svg
    xmlns="http://www.w3.org/2000/svg"
    width="900"
    height="900"
    viewBox="0 0 900 900"
>

<defs>

    <linearGradient
        id="goldLine"
        x1="0%"
        y1="0%"
        x2="100%"
        y2="0%"
    >

        <stop
            offset="0%"
            stop-color="#6F5B1D"
        />

        <stop
            offset="50%"
            stop-color="#D4AF37"
        />

        <stop
            offset="100%"
            stop-color="#6F5B1D"
        />

    </linearGradient>


    <style>

        .info-row {
            opacity: 0;

            animation:
                fadeIn
                0.5s
                ease-out
                forwards;
        }


        .label {
            fill: #D4AF37;

            font-family:
                "DejaVu Sans Mono",
                "Liberation Mono",
                monospace;

            font-size: 16px;

            font-weight: 700;

            letter-spacing: 1px;
        }


        .value {
            fill: #C7C7C7;

            font-family:
                "DejaVu Sans Mono",
                "Liberation Mono",
                monospace;

            font-size: 15px;

            font-weight: 400;
        }


        @keyframes fadeIn {

            from {
                opacity: 0;
                transform:
                    translateY(6px);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0);
            }

        }

    </style>

</defs>


<!-- Main terminal -->

<rect
    x="1"
    y="1"
    width="898"
    height="898"
    rx="28"
    fill="#090909"
    stroke="#292929"
    stroke-width="2"
/>


<!-- Inner panel -->

<rect
    x="14"
    y="14"
    width="872"
    height="872"
    rx="20"
    fill="#0d0d0d"
/>


<!-- Terminal buttons -->

<circle
    cx="34"
    cy="34"
    r="7"
    fill="#ff5f57"
/>

<circle
    cx="58"
    cy="34"
    r="7"
    fill="#febc2e"
/>

<circle
    cx="82"
    cy="34"
    r="7"
    fill="#28c840"
/>


<!-- Terminal title -->

<text
    x="112"
    y="40"
    fill="#C7C7C7"
    font-family="monospace"
    font-size="17"
    letter-spacing="1"
>
    SAZIDDEVELOER
</text>


<text
    x="755"
    y="40"
    fill="#8F7727"
    font-family="monospace"
    font-size="11"
