name: Update Profile Art

on:
  schedule:
    - cron: "17 6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-ci.txt

      - name: Fetch GitHub contributions
        run: |
          python scripts/fetch_contributions.py

      - name: Render contribution heatmap
        run: |
          python scripts/render_heatmap_svg.py

      - name: Commit updated profile art
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add contrib-heatmap.svg data/contributions.json

          git diff --cached --quiet || git commit -m "chore: update contribution art [skip ci]"

          git push