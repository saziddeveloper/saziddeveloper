<?xml version="1.0" encoding="UTF-8"?>

<svg
    xmlns="http://www.w3.org/2000/svg"
    width="800"
    height="800"
    viewBox="0 0 800 800"
>

    <defs>

        <clipPath id="asciiClip">
            <rect
                x="0"
                y="0"
                width="800"
                height="800"
            >
                <animate
                    attributeName="width"
                    from="0"
                    to="800"
                    dur="2.2s"
                    begin="0s"
                    fill="freeze"
                />
            </rect>
        </clipPath>

        <filter id="glow">
            <feGaussianBlur
                stdDeviation="1.5"
                result="blur"
            />

            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

    </defs>

    <rect
        width="100%"
        height="100%"
        rx="28"
        fill="#0d0d0d"
        stroke="#3a3a3a"
        stroke-width="2"
    />

    <!-- Terminal header -->

    <circle cx="32" cy="32" r="7" fill="#ff5f57"/>
    <circle cx="56" cy="32" r="7" fill="#febc2e"/>
    <circle cx="80" cy="32" r="7" fill="#28c840"/>

    <text
        x="110"
        y="38"
        fill="#888888"
        font-family="monospace"
        font-size="18"
    >
        SAZIDDEVELOPER
    </text>

    <!-- ASCII portrait -->

    <g
        clip-path="url(#asciiClip)"
        filter="url(#glow)"
    >

        <style>
            .ascii-line {
                fill: #EBE1DF;
                font-family: "Courier New", monospace;
                font-size: 11px;
                font-weight: 700;
                white-space: pre;
                opacity: 0;
                animation: fin 0.35s ease-out forwards;
            }

            @keyframes fin {
                from {
                    opacity: 0;
                    transform: translateX(-8px);
                }

                to {
                    opacity: 1;
                    transform: translateX(0);
                }
            }
        </style>

        
